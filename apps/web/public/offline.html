<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MBN Health — Offline</title>
    <style>
      body {
        margin: 0;
        display: flex;
        min-height: 100vh;
        align-items: center;
        justify-content: center;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        background: #f8fafc;
        color: #0f172a;
        text-align: center;
        padding: 24px;
      }
      .card {
        max-width: 360px;
      }
      .badge {
        width: 56px;
        height: 56px;
        border-radius: 14px;
        background: #0ea5e9;
        margin: 0 auto 16px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      h1 {
        font-size: 18px;
        margin: 0 0 8px;
      }
      p {
        font-size: 14px;
        color: #64748b;
        margin: 0;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="badge">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 12h-2.48a2 2 0 0 0-1.93 1.46l-2.35 8.36a.25.25 0 0 1-.48 0L9.24 2.18a.25.25 0 0 0-.48 0l-2.35 8.36A2 2 0 0 1 4.49 12H2" />
        </svg>
      </div>
      <h1>You're offline</h1>
      <p>MBN Health needs a connection to load your data. Reconnect and try again.</p>
    </div>
  </body>
</html>
