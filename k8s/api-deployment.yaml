apiVersion: apps/v1
kind: Deployment
metadata:
  name: mbn-api
  labels:
    app: mbn-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mbn-api
  template:
    metadata:
      labels:
        app: mbn-api
    spec:
      containers:
        - name: api
          image: ghcr.io/mbnhealth/api:latest
          ports:
            - containerPort: 4000
          envFrom:
            - configMapRef:
                name: mbn-api-config
            - secretRef:
                name: mbn-api-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: 4000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 4000
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: mbn-api
spec:
  selector:
    app: mbn-api
  ports:
    - port: 80
      targetPort: 4000
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: mbn-api-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: mbn-api
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
