# Copy this file, fill in real values, and apply it — do not commit real secrets.
apiVersion: v1
kind: ConfigMap
metadata:
  name: mbn-api-config
data:
  NODE_ENV: "production"
  API_PORT: "4000"
  CORS_ORIGIN: "https://app.mbnhealth.com"
  S3_ENDPOINT: "https://s3.amazonaws.com"
  S3_REGION: "us-east-1"
  S3_BUCKET: "mbn-health-attachments"
  S3_FORCE_PATH_STYLE: "false"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mbn-web-config
data:
  NEXT_PUBLIC_API_URL: "https://api.mbnhealth.com"
---
apiVersion: v1
kind: Secret
metadata:
  name: mbn-api-secrets
type: Opaque
stringData:
  DATABASE_URL: "postgresql://user:password@postgres-host:5432/mbn_health"
  REDIS_URL: "redis://redis-host:6379"
  JWT_ACCESS_SECRET: "replace-with-a-real-32-plus-char-secret"
  JWT_REFRESH_SECRET: "replace-with-a-real-32-plus-char-secret"
  S3_ACCESS_KEY_ID: "replace-me"
  S3_SECRET_ACCESS_KEY: "replace-me"
